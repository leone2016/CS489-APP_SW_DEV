name: Lab2 PAMS Workflow

on:
  push:
    branches:
      - lab2/pams
  pull_request:
    branches:
      - lab2/pams

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Grant execute permission for gradlew
        run: chmod +x LAB2/PAMS/gradlew
        
      - name: Build with Gradle
        working-directory: LAB2/PAMS
        run: ./gradlew bootJar
        
      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pams-v${{ github.run_number }}
          name: PAMS Release v${{ github.run_number }}
          files: LAB2/PAMS/build/libs/PAMS-0.0.1-SNAPSHOT.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
